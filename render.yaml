services:
  # Backend Service (Node.js API)
  - type: web
    name: ludus-backend-gf1g
    env: node
    plan: starter
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render dashboard
      - key: JWT_SECRET
        sync: false # Set in Render dashboard
      - key: JWT_REFRESH_SECRET
        sync: false # Set in Render dashboard
      - key: MOYASAR_SECRET_KEY
        sync: false # Set in Render dashboard
      - key: MOYASAR_PUBLISHABLE_KEY
        sync: false # Set in Render dashboard
      - key: MOYASAR_WEBHOOK_SECRET
        sync: false # Set in Render dashboard
      - key: CLIENT_URL
        value: https://app.letsludus.com

  # Frontend Service (Static React App)
  - type: static
    name: ludus-frontend-og2d
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/build
    # Enable Render's built-in SPA support (testing alternative approach)
    spa: true
    # Alternative SPA routing configuration
    routes:
      # Ensure API calls go to backend
      - type: rewrite
        source: "/api/*"
        destination: "https://ludus-backend-gf1g.onrender.com/api/*"
      # Force SPA routing for all non-API routes
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    headers:
      - path: /*
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      - path: /static/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      # Add CORS headers for SPA routing
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"