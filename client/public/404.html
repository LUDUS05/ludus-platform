<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LUDUS - Page Not Found</title>
    <script>
        // SPA Fallback: Redirect to React app and let React Router handle routing
        // This ensures SPA routing works even if Render's SPA config fails
        window.location.href = '/?spa-fallback=true&original-path=' + encodeURIComponent(window.location.pathname);
    </script>
</head>
<body>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>LUDUS</h1>
        <p>Page Not Found</p>
        <p>The page you're looking for doesn't exist.</p>
        <p><a href="/">Return to Home</a></p>
        <p><small>Redirecting to React app...</small></p>
    </div>
</body>
</html>
