<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LUDUS - Loading...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/logo192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/css/main.0a8a026c.css">
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
        <div style="padding: 40px; text-align: center; font-family: Arial, sans-serif;">
            <h1>🔄 Loading LUDUS...</h1>
            <p>Please wait...</p>
        </div>
    </div>
    
    <script>
        // Seamless SPA routing: Fast redirect with minimal URL visibility
        const currentPath = window.location.pathname;
        
        // Only redirect if it's not the home page
        if (currentPath !== '/') {
            // Build redirect URL
            const redirectUrl = '/?spa-redirect=' + encodeURIComponent(currentPath);
            
            // Fast redirect with minimal delay
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 100); // Very short delay for better UX
        }
    </script>
</body>
</html>
