<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LUDUS - Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/logo192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/css/main.0a8a026c.css">
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
        <div style="padding: 40px; text-align: center; font-family: Arial, sans-serif;">
            <h1>🔄 Redirecting to LUDUS...</h1>
            <p>Please wait while we redirect you to the correct page...</p>
        </div>
    </div>
    
    <script>
        // Server-side SPA routing: Immediate redirect to home
        // This approach is more reliable than client-side fallbacks
        
        // Get the current path that caused the 404
        const currentPath = window.location.pathname;
        const currentSearch = window.location.search;
        const currentHash = window.location.hash;
        
        // Build the redirect URL with the original path as a parameter
        const redirectUrl = '/' + 
            (currentSearch ? currentSearch + '&' : '?') + 
            'spa-redirect=' + encodeURIComponent(currentPath) +
            (currentHash ? currentHash : '');
        
        console.log('SPA Redirect: Redirecting from', currentPath, 'to', redirectUrl);
        
        // Immediate redirect to home with path parameter
        window.location.href = redirectUrl;
    </script>
</body>
</html>
