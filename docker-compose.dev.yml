# LUDUS Platform - Development Docker Compose
# Generated by Claude (Aether-Render Project Manager) - 2025-01-27 18:45 GMT+3

version: '3.8'

services:
  # =============================================================================
  # DATABASE SERVICES
  # =============================================================================

  mongodb:
    image: mongo:7.0
    container_name: ludus-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: ludus_dev
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - ludus-network

  redis:
    image: redis:7.2-alpine
    container_name: ludus-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ludus-network

  # =============================================================================
  # BACKEND SERVICE
  # =============================================================================

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: ludus-backend-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/ludus_dev?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-for-development-only
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    networks:
      - ludus-network
    command: npm run dev

  # =============================================================================
  # FRONTEND SERVICE
  # =============================================================================

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: ludus-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_ENVIRONMENT: development
      CHOKIDAR_USEPOLLING: true
      WATCHPACK_POLLING: true
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ludus-network
    command: npm start

  # =============================================================================
  # AI SERVICES
  # =============================================================================

  ai-services:
    build:
      context: ./apps/ai-agents
      dockerfile: Dockerfile.api
    container_name: ludus-ai-services-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./apps/ai-agents:/app
    depends_on:
      - redis
      - ollama
    networks:
      - ludus-network

  # =============================================================================
  # OLLAMA SERVICE
  # =============================================================================

  ollama:
    image: ollama/ollama:latest
    container_name: ludus-ollama-dev
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    networks:
      - ludus-network
    # Note: Ollama models need to be pulled manually
    # Run: docker exec ludus-ollama-dev ollama pull llama3.1

  # =============================================================================
  # MONITORING SERVICES
  # =============================================================================

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ludus-mongo-express-dev
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - ludus-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ludus-redis-commander-dev
    restart: unless-stopped
    ports:
      - "8083:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - ludus-network

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  ludus-network:
    driver: bridge
